name = "github-readme-stats"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "src/worker.ts"

[assets]
directory = "public"
binding = "ASSETS"

[vars]
CACHE_SECONDS = "3600"
GITHUB_USERNAME = "machfudn"
README_THEME = "transparent"
README_LOCALE = "en"
README_INCLUDE_ALL_COMMITS = "true"
README_LANGS_COUNT = "8"
